services:
  - type: web
    name: scicalc-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MONGODB_URL
        sync: false          # Set this in Render Dashboard → Environment
      - key: DATABASE_NAME
        value: scientific_calculator
      - key: AI_API_KEY
        sync: false          # Optional — leave blank if not using AI
      - key: AI_MODEL
        value: gpt-4o-mini
      - key: PYTHON_VERSION
        value: "3.11.9"
